# Shared Skill Patch Manifest
#
# Defines the local patch rules for both upstream Spec Kit skills imported via
# scripts/specify.sh and third-party skills synced via scripts/skill-sync.sh.
#
# Injection Strategies:
#   after-frontmatter              - Inject immediately after YAML front matter
#   replace-before-section:<name>  - Replace content after front matter up to a section heading
#   before-section:<name>          - Inject before a section heading
#   after-section:<name>           - Inject after a section heading
#   append                         - Append at end of file
#   prepend                        - Prepend at start of file
#
# Frontmatter Overrides:
#   Set or add a field:  key: value
#   Remove a field:      key: null

# Usage:
#   1. Create a patch file in the appropriate subdirectory:
#      - scripts/skill-patches/skills/<name>.patch.md
#      - scripts/skill-patches/templates/<name>-template.patch.md
#
#   2. Configure the injection point below. Keep defaults as the fallback rule,
#      but declare the current per-skill intent explicitly in `overrides`.
#
#   3. Optionally configure frontmatter field overrides below.
#
#   4. Run: make specify or make skill-sync

defaults:
  skills: after-frontmatter
  templates: after-frontmatter

overrides:
  # Superpowers skills
  brainstorming/SKILL.md: after-frontmatter
  dispatching-parallel-agents/SKILL.md: after-frontmatter
  executing-plans/SKILL.md: after-frontmatter
  finishing-a-development-branch/SKILL.md: after-frontmatter
  incremental-implementation/SKILL.md: after-frontmatter
  receiving-code-review/SKILL.md: after-frontmatter
  requesting-code-review/SKILL.md: after-frontmatter
  subagent-driven-development/SKILL.md: after-frontmatter
  using-git-worktrees/SKILL.md: after-frontmatter
  writing-plans/SKILL.md: after-frontmatter
  # Spec Kit skills
  speckit-analyze/SKILL.md: after-frontmatter
  speckit-checklist/SKILL.md: after-frontmatter
  speckit-clarify/SKILL.md: after-frontmatter
  speckit-constitution/SKILL.md: after-frontmatter
  speckit-converge/SKILL.md: after-frontmatter
  speckit-implement/SKILL.md: after-frontmatter
  speckit-plan/SKILL.md: after-frontmatter
  speckit-specify/SKILL.md: after-frontmatter
  speckit-tasks/SKILL.md: after-frontmatter
  speckit-taskstoissues/SKILL.md: after-frontmatter

frontmatter:
