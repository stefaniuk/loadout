name: "Validate customisations"

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  validate-customisations:
    name: "Validate customisations"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Read the mise version"
        id: variables
        run: |
          source scripts/docker/docker.lib.sh
          echo "mise_version=$(_toml-table-entry "" min_version mise.toml)" >> "$GITHUB_OUTPUT"
      - name: "Set up mise"
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: ${{ steps.variables.outputs.mise_version }}
          install: true
          install_args: "python uv"
          persist_github_token: false
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: "Validate customisation artefacts"
        run: make validate-customisations
